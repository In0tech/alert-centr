[project]
name = "alert-centre-backend"
version = "0.1.0"
description = "REST API for Alert Centre"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
